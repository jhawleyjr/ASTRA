# CI for pull requests (docs/process/workflow.md §Verification, ADR-0000 row "CI"). The job is named
# `check`; the main ruleset (.github/rulesets/main.json) requires it before a merge, so this job must
# always report, even when it deliberately runs nothing.
#
# GATE is the one knob.
#
#   local (current, M2-M3)  The authoritative gate is `just check` on Joe's machine, run once after the
#                           task and before the push. CI runs only what the local gate cannot cover as
#                           cheaply -- today that is nothing but the hook cases -- and says so in the run
#                           summary. A green `check` here means "not tested in CI", not "tested".
#   full                    CI runs `just check` itself, the original arrangement.
#
# Why local, decided 2026-09-16: `ctest` is ~556 s real per preset (the 7 `physics` tests are ~95% of
# it; the 134 `unit` tests are 7 s), so four presets is ~37 minutes of tests per run. That overran the
# job timeout and does not fit the 2,000-minute monthly allowance while the same tree is already tested
# locally on every task. Nothing about the tree is less verified -- the gate moved, it did not go away.
#
# Before flipping to full: run the `physics`-labelled tests under the asan preset only and
# `ctest -LE physics` under the other three. That is ~28 of the ~37 minutes, and asan is the preset
# most likely to catch a physics bug the others would not.
name: check

on:
  pull_request:
    # Deliberately not `synchronize`: open the PR as a draft (`gh pr create --draft`), push as often as
    # you like without synchronize runs, then `gh pr ready` requests checks on the candidate.
    # After later pushes, rerun via `gh pr ready --undo && gh pr ready` and inspect the actual
    # current-head check results. Local validation/review evidence must also match that candidate.
    types: [opened, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  GATE: local # "local" | "full" -- see the header

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validation wrapper syntax
        run: bash -n scripts/check-fast.sh scripts/check-full.sh

      # Two questions, not one: does this diff touch anything the gate would build, and does it touch
      # the hooks (whose only real test is the case runner, which needs no build at all)?
      - name: Scope
        id: scope
        run: |
          base_ref="${{ github.base_ref }}"
          [ -n "$base_ref" ] || base_ref=main
          git fetch -q --no-tags origin "$base_ref"
          changed=$(git diff --name-only "$(git rev-parse FETCH_HEAD)...HEAD")
          printf 'changed files:\n%s\n' "$changed"
          code=false
          hooks=false
          if printf '%s\n' "$changed" \
               | grep -qvE '^(docs/|\.github/|\.claude/|README\.md$|STATE\.md$|PLAN\.md$|LICENSE$)'; then
            code=true
          fi
          if printf '%s\n' "$changed" | grep -qE '^\.claude/(hooks/|settings\.json$)'; then
            hooks=true
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "hooks=$hooks" >> "$GITHUB_OUTPUT"

      # `just` alone, not scripts/setup-ubuntu.sh: the case runner needs the binary for its busy-tree
      # case and nothing else, so this is seconds rather than the full clang/Eigen/yaml-cpp toolchain.
      - name: "Hook cases: just hooks-test"
        id: hooks_gate
        if: steps.scope.outputs.hooks == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq just
          just hooks-test

      - name: "Toolchain: scripts/setup-ubuntu.sh --ci (the one apt list, shared with the developer setup)"
        if: env.GATE == 'full' && steps.scope.outputs.code == 'true'
        run: ./scripts/setup-ubuntu.sh --ci

      - name: Let ASan map its shadow under the runner kernel's ASLR entropy
        if: env.GATE == 'full' && steps.scope.outputs.code == 'true'
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: just check
        id: full_gate
        if: env.GATE == 'full' && steps.scope.outputs.code == 'true'
        run: just check

      # Report actual step outcomes, including failed/skipped prerequisites; never infer a pass
      # from the planned scope. The job and GATE=local remain unchanged.
      - name: Say what was run
        if: always()
        env:
          FULL_OUTCOME: ${{ steps.full_gate.outcome }}
          HOOKS_OUTCOME: ${{ steps.hooks_gate.outcome }}
        run: |
          {
            echo "### check: GATE=${GATE}"
            if [ "$GATE" = full ]; then
              case "$FULL_OUTCOME" in
                success) echo '- `just check` passed in CI.' ;;
                failure) echo '- `just check` failed in CI; this candidate is not validated.' ;;
                *) echo "- Full gate did not complete successfully (outcome: ${FULL_OUTCOME:-not run}); inspect prerequisite steps." ;;
              esac
            else
              echo '- **The full gate did NOT run in CI.** It runs locally to conserve GitHub minutes.'
              echo '- Current-candidate local validation and review evidence are required; a green CI badge is not a full-gate result.'
            fi
            echo "- Hook cases outcome: ${HOOKS_OUTCOME:-not run}."
          } >> "$GITHUB_STEP_SUMMARY"
