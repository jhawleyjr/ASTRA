# CI: `just check` on every pull request (docs/process/workflow.md §Verification, ADR-0000 row "CI").
# The job is named `check`; PR 4 adds it to the main ruleset as a required status check.
name: check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain (Ubuntu 24.04 apt only; scripts/setup-ubuntu.sh is the developer equivalent)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-18 clang-tidy-18 clang-format-18 cmake ninja-build just gcc \
            libeigen3-dev libgtest-dev libgmock-dev

      - name: Let ASan map its shadow under the runner kernel's ASLR entropy
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: just check
        run: just check
