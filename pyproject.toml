# The ASTRA Python package (docs/architecture.md §12): astra._core, a nanobind 3 module over libastra_core that
# scikit-build-core builds into build/python, plus the pure-Python tools later milestones add under python/astra/.
# Editable-only by design: nobody ships or imports a prebuilt module (ADR-0009); `just python` installs it into .venv.
[build-system]
requires = ["scikit-build-core>=1.0", "nanobind>=3.0"]
build-backend = "scikit_build_core.build"

[project]
name = "astra"
# The version is read from project(ASTRA VERSION ...) in CMakeLists.txt (tool.scikit-build.metadata below), so it
# has one source; tests/python/test_package.py checks the module and the distribution agree.
dynamic = ["version"]
description = "Vehicle-agnostic 6-DoF simulation framework that runs real embedded software against the sim"
requires-python = ">=3.12"
dependencies = ["numpy>=2"]

[project.scripts]
# M6 PR 3 (docs/plans/m6-pr3-cli.md): `astra run` and `astra trim`; later M6 PRs add the other subcommands.
astra = "astra.cli:console"

[dependency-groups]
# What the gate needs, pinned: `just venv` installs this group. The analysis libraries joined when a milestone used
# them.
dev = [
  "nanobind==3.0.1",
  "scikit-build-core==1.0.3",
  "numpy>=2",
  "pytest==9.1.1",
  "ruff==0.16.7",
  "pyright==1.1.414",
  # M3 PR 6 (astra.trim, docs/plans/pr6-trim.md, D9): current release at pin time, 2026-09-21.
  "scipy==1.18.1",
  "pyyaml==6.0.3",
  # M5 PR 5 (astra.log, docs/plans/m5-tooling.md Q2, approved by Joe 2026-09-26): current releases at pin time.
  # h5py's wheel bundles its own libhdf5 (2.0.0) beside the system 1.10 that libastra_core links (plan R8).
  "h5py==3.16.0",
  "pandas==3.0.5",
  # M5 PR 7 (astra.montecarlo's summary.parquet, plan Q2, approved by Joe 2026-09-26): current release at pin time,
  # 2026-09-28. It ships no py.typed, so astra.montecarlo casts at its boundary (docs/lessons.md 2026-09-21).
  "pyarrow==25.0.1",
  # M6 PR 5 (astra.plot, docs/plans/m6-analysis-tooling.md Q2, decided by Joe 2026-09-29): current releases at pin
  # time, 2026-10-01. matplotlib draws the files (SVG byte-deterministic under these pins), plotly the offline HTML.
  "matplotlib==3.11.2",
  "plotly==7.1.0",
]

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/python"
# Release, clang-18, no sanitizers: the presets stay C++-only because a sanitized extension cannot be imported by
# a plain interpreter without LD_PRELOAD (python/CMakeLists.txt refuses one).
cmake.build-type = "Release"
# ASTRA_BUILD_TESTS pinned on: tests/python loads the test plugins this build writes to build/python/plugins.
cmake.define = { CMAKE_CXX_COMPILER = "clang++-18", ASTRA_BUILD_PYTHON = "ON", ASTRA_BUILD_TESTS = "ON" }
wheel.packages = ["python/astra"]
editable.mode = "redirect"
editable.rebuild = false

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "CMakeLists.txt"
regex = 'project\(ASTRA VERSION (?P<value>[0-9]+\.[0-9]+\.[0-9]+)'

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["python", "tests/python"]
# _core.pyi is generated by nanobind_add_stub at build; not ours to lint. *.md: ruff formats Python fences inside
# Markdown, which would grade every ADR and let `just format` rewrite human-owned docs/decisions/** (docs/lessons.md).
extend-exclude = ["python/astra/_core.pyi", "*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "PT", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["astra"]

[tool.pytest.ini_options]
testpaths = ["tests/python", "tests/scenarios"]
addopts = "-ra"
xfail_strict = true
# Warnings are errors, like -Werror on the C++ side.
filterwarnings = ["error"]
