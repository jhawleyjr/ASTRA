# NASA/TM-2015-218675 Vol II Table 27, atmospheric check-case 3 ("dragless tumbling brick with
# aerodynamic damping"): identical scenario to case 2, except the brick's rotational damping is turned
# on (Cl_p = Cm_q = Cn_r = -1.0, Vol II Table 5) while drag stays exactly zero (C_D = 0) -- this case
# exercises real rotational damping response and inertial coupling, not a degenerate channel; its
# nonzero moments are the whole point (docs/decisions/0014-nesc-per-channel-tolerance-floor.md's own
# corrected Context section makes the same point explicitly).
# Position corrected, R8 cross-check (this session), same finding as case 2's own config comment:
# Table 27 prints [0, 0, 0], but this is a repeat of case 2's scenario (C.1.3's own prose) which is
# itself "dropped from the same initial position as ... scenario 1 (30,000 ft...)" -- confirmed
# against Atmos_03's own t=0 CSV rows, which show altitudeMsl_ft = 30000 for every participant.
sim:
  dt: 0.001
  frames: 30000
vehicle:
  models:
    - plugin: tests/plugins/nesc_aero
      s: 0.020644913548800003 # 0.22222 ft^2 (Vol II Table 5)
      b: 0.101598984 # 0.33333 ft
      cbar: 0.203201016 # 0.66667 ft
      cd: 0.0
      clp: -1.0
      cmq: -1.0
      cnr: -1.0
physical:
  earth: plugins/physical/earth/wgs84_rotating
  gravity: plugins/physical/gravity/wgs84_j2
  atmosphere: plugins/physical/atmosphere/isa1976
  mass:
    plugin: plugins/physical/mass/constant
    mass: 2.2679618958564327 # 0.155404754 slug (Vol II Table 4)
    ixx: 0.0025682174740883057 # 0.001894220 slug-ft^2
    iyy: 0.008421011037627346 # 0.006211019 slug-ft^2
    izz: 0.009754655939231737 # 0.007194665 slug-ft^2
initial:
  state:
    p_n: [0.0, 0.0, 9144.0] # 30,000 ft (corrected, R8 -- see header comment)
    omega_b: [0.17453292519943295, 0.3490658503988659, 0.5235987755982988] # 10, 20, 30 deg/s
