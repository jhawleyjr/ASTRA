# M7 PR 14's consumption test (tests/python/test_config_keys.py): an ordinary tracked config that loads
# aircraft/_template's three plugins with numbers. aircraft/_template/configs/cruise.yaml refuses at its
# first TODO zero by design, so no other tracked config shows what those plugins read. The numbers are the
# notional transport's (aircraft/notional_transport/configs/cruise_still_air.yaml), as in
# tests/python/test_trim_round_trip.py's filled-in template. The mass also sets ixy and iyz beside the
# notional ixz; the tensor stays strictly diagonally dominant, so it is positive-definite.
sim:
  dt: 0.001
  frames: 10
vehicle:
  models:
    - plugin: aircraft/_template/physical/aero
      wing_area_m2: 108.78945984
      wingspan_m: 28.864560
      mean_chord_m: 3.752088
      r_aero_b_x_m: 0.3556
      r_aero_b_y_m: 0.0
      r_aero_b_z_m: -1.6256
      cl_0: 0.20
      cl_alpha_per_rad: 4.3478260869565215
      cl_elevator_per_rad: 0.2
      cd_0: 0.021
      cd_k: 0.043
      cy_beta_per_rad: -1.0
      croll_beta_per_rad: -0.09
      croll_p_per_rad: -0.4
      croll_r_per_rad: 0.09
      croll_aileron_per_rad: 0.0743
      croll_rudder_per_rad: 0.01
      cm_alpha_per_rad: -0.6
      cm_q_per_rad: -27.0
      cm_elevator_per_rad: -0.8544
      cn_beta_per_rad: 0.26
      cn_r_per_rad: -0.35
      cn_rudder_per_rad: -0.20
    - plugin: aircraft/_template/hardware/propulsion/turbofan
      station: left
      x_offset_from_cg_m: 2.5146
      y_offset_from_cg_m: -4.9022
      z_offset_from_cg_m: 0.0
      thrust_ref_n: 29878.121867743088
      density_ref_kgm3: 0.4128
    - plugin: aircraft/_template/hardware/propulsion/turbofan
      station: right
      x_offset_from_cg_m: 2.5146
      y_offset_from_cg_m: 4.9022
      z_offset_from_cg_m: 0.0
      thrust_ref_n: 29878.121867743088
      density_ref_kgm3: 0.4128
  initial_controls:
    controls:
      elevator: 0.026674474137989946
      aileron: 0.0
      rudder: 0.0
      throttle: 0.4985979490507746
physical:
  earth: plugins/physical/earth/flat
  gravity: plugins/physical/gravity/constant
  atmosphere: plugins/physical/atmosphere/isa1976
  mass:
    plugin: aircraft/_template/physical/mass
    mass: 37648.0
    ixx: 761970.0
    iyy: 1997120.0
    izz: 2567919.0
    ixy: 1000.0
    ixz: -10846.5
    iyz: 2000.0
initial:
  state:
    p_n: [0.0, 0.0, -10000.0]
    v_b: [230.0, 0.0, 0.0]
    euler_nb: [0.0, 0.0, 0.0]
    omega_b: [0.0, 0.0, 0.0]
